name: Security Scan Test

on: [push]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create a Real Vulnerable Python Manifest
        run: |
          # urllib3 1.24.1 has multiple known High & Critical CVEs (CVE-2019-11324, CVE-2020-26137)
          echo "urllib3==1.24.1" > requirements.txt
          echo "flask==0.12" >> requirements.txt

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Tells Trivy to FAIL the pipeline on High/Critical!
